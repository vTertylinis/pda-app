<header class="ui-header">
  <div class="ui-toolbar">
    <h1 class="ui-title">Επιλέξτε τραπέζι μεταφοράς</h1>
    <div class="ui-buttons">
      <button class="ui-button" data-size="large" (click)="close()" type="button" aria-label="Close">
        <span class="ui-icon" aria-hidden="true">×</span>
      </button>
    </div>
  </div>
</header>

<main data-color="light" class="ui-content page-padding">
  <app-table-grid
    [customTables]="customTables"
    [activity]="activity"
    [disabledTable]="table"
    (tableSelected)="onSelectTable($event)">
  </app-table-grid>
</main>
